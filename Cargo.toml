[package]
name = "kanso"
version = "0.1.0"
edition = "2021"
description = "Reference interpreter for the kanso language"
license = "MIT"

[dependencies]
num-bigint = "0.4"
num-traits = "0.2"

# The interactive repl (rustyline) is native-only; the browser playground has
# no terminal, and rustyline's dependency tree does not build for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustyline = "18.0.1"

[[bin]]
name = "kanso"
path = "src/main.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
wasmi = "1.1.0"

# wasmi interprets the whole toolchain, so an unoptimised build of it turns
# the third engine's corpus run from seconds into minutes. Only the dependency
# is optimised; kanso itself still builds debug, so a test still gets a
# readable backtrace.
[profile.dev.package.wasmi]
opt-level = 3

[profile.dev.package.wasmi_ir]
opt-level = 3

[profile.dev.package.wasmi_collections]
opt-level = 3

# The chain-depth spec reads a child's peak resident size. time(1) supplied it
# until a container without /usr/bin/time turned a missing tool into a spec
# failure that named the interpreter; wait4 asks the kernel, which is always
# there. Test-only, and already in the lock file under rustyline.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
