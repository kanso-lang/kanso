[package]
name = "kanso"
version = "0.1.0"
edition = "2021"
description = "Reference interpreter for the kanso language"
license = "MIT"

[dependencies]
num-bigint = "0.4"
num-traits = "0.2"

# The interactive repl (rustyline) is native-only; the browser playground has
# no terminal, and rustyline's dependency tree does not build for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustyline = "18.0.1"
# The compiler's allocator. glibc's malloc was 15.17% of `kanso check`; mimalloc
# is a static C library with no new shared object, and the same reason keeps it
# native-only — it does not build for wasm32, where the playground has no
# global allocator of its own anyway.
mimalloc = { version = "0.1", default-features = false }
libmimalloc-sys = { version = "0.1", default-features = false, features = ["extended"] }

[[bin]]
name = "kanso"
path = "src/main.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
wasmi = "1.1.0"
# The browser rows count every wasm instruction a module executes, with a
# counter written into a copy of the module (`tests/support/wasm32.rs`).
wasmparser = { version = "0.254", default-features = false, features = ["std"] }
wasm-encoder = { version = "0.254", default-features = false, features = ["std", "wasmparser"] }
wat = "1.254"

# wasmi interprets the whole toolchain, so an unoptimised build of it turns
# the third engine's corpus run from seconds into minutes. Only the dependency
# is optimised; kanso itself still builds debug, so a test still gets a
# readable backtrace.
# One codegen unit and fat LTO, so the optimizer sees the whole crate and
# its dependencies when it inlines. rustc's default of sixteen units splits
# the crate by module, which made the compiler slower and made a pure move
# between modules change what was inlined, and with it every compile row.
# A release build takes about a minute longer.
[profile.release]
codegen-units = 1
lto = "fat"

[profile.dev.package.wasmi]
opt-level = 3

[profile.dev.package.wasmi_ir]
opt-level = 3

[profile.dev.package.wasmi_collections]
opt-level = 3

# The chain-depth spec reads a child's peak resident size. time(1) supplied it
# until a container without /usr/bin/time turned a missing tool into a spec
# failure that named the interpreter; wait4 asks the kernel, which is always
# there. Test-only, and already in the lock file under rustyline.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
