name: ci

on:
  pull_request:
  push:
    branches: [main]
  # A pull request that produces no run at all reads exactly like one whose
  # checks passed. Two different failures share that symptom: a CONFLICTING
  # pull request gets no run because no merge ref exists — the first question
  # for an empty board is `gh pr view --json mergeable`, and the fix is a
  # rebase — and a genuine trigger failure, which is what this lever exists
  # for: dispatch the run by hand and wait for real results.
  workflow_dispatch:

# One job per kind of check, so a red run names what broke on the PR page
# instead of hiding it inside a single "test" job.
jobs:

  format:
    name: format (rustfmt, checked not applied)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  python-free:
    name: python-free (the harnesses stay kanso)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/gates/python_free.sh

  lint:
    name: lint (clippy, all targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # --all-targets so the specs are linted too; without it the tests drift
      # while the library stays clean.
      - run: cargo clippy --all-targets -- -D warnings

  specs:
    name: specs (unit, golden, differential)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # the wasm engine test runs docs/kanso.wasm, and the committed artifact
      # is whatever the last author remembered to rebuild — building it here
      # is what makes the third engine's result about this commit's source
      - name: rebuild the engine the wasm spec runs
        run: |
          rustup target add wasm32-unknown-unknown
          sh scripts/build_wasm.sh
      - run: cargo test
      - name: the shipped library's own tests
        run: |
          cargo run -- test lib/expect
          cargo run -- test lib/json
          cargo run -- test lib/list
          cargo run -- test lib/path

  other-host:
    # Every other job runs on linux, and two defects in two days turned on
    # which machine built the program: an IR that macOS refused and linux ran,
    # and a modulo that answers on ARM and raises a floating-point exception on
    # x86. Each host caught what the other could not see. The differential law
    # compares engines; nothing was comparing hosts.
    #
    # This runs the suite and the arithmetic sweep on the other one. It is the
    # only job here that is not linux, and macOS minutes bill at a multiple —
    # so it is the suite and the sweep, not the whole board.
    name: the other host (macos, arm)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # the same reason the linux suite rebuilds it: the committed artifact is
      # whatever the last author remembered, and a stale one would fail this
      # job for a reason that has nothing to do with the host
      - name: rebuild the engine the wasm spec runs
        run: |
          rustup target add wasm32-unknown-unknown
          sh scripts/build_wasm.sh
      - run: cargo test
      - name: integer arithmetic, on the architecture linux is not
        run: |
          cargo build --release
          ./target/release/kanso run scripts/numeric_differential -- 0

  playground:
    name: playground examples (every engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --test playground

  decoder:
    name: json decoder end-to-end (native, 150 decodes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: the checksum the decoder owes
        run: sh scripts/gates/native_checksum.sh

  utf8:
    name: utf-8 validator (differential vs an independent reference)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          cargo build --release
          ./target/release/kanso run scripts/utf8_differential

  fingerprints:
    name: asset digests (every reference rewritten, site still runs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - name: the jekyll container owns _site, so take it back
        run: sudo chown -R "$USER" ./_site
      - run: cargo build --release
      - run: ./target/release/kanso run scripts/fingerprint -- ./_site
      - name: no undigested reference survives
        run: sh scripts/gates/undigested_references.sh

  welfare:
    name: welfare (one number over runtime and compile cost, ratcheted)
    runs-on: ubuntu-latest
    # Welfare's run-speed terms are read out of bench/instructions_golden.txt,
    # and nothing in this job re-measures them. cost-goldens is what proves that
    # file describes this commit, so the score waits for it: a number computed
    # from a vein nobody has checked carries the gate's authority without its
    # evidence. On 2026-08-13 that reported a gain for a change that made the
    # decoder 12.2% slower, and the floor was ratcheted on the reading.
    needs: cost-goldens
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      # The score and its per-term breakdown on the run page, not only in a
      # log somebody has to open and scroll. The script still gates; this is
      # the same output, rendered where it is read.
      - name: welfare, and where it came from
        run: |
          set +e
          ./target/release/kanso run scripts/welfare >/tmp/welfare.txt 2>&1
          verdict=$?
          set -e
          {
            echo "## welfare"
            echo ""
            echo '```'
            cat /tmp/welfare.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/welfare.txt
          exit $verdict
      - name: prose numbers match the golden they quote
        run: ./target/release/kanso run scripts/golden_prose

  grammar:
    name: editor grammar (types, strings, comments, operators)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the check is a kanso program, so the job compiles the toolchain it runs
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: ./target/release/kanso run scripts/grammar_check

  book:
    name: book samples (every panel executed, outputs verified)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # book_check runs target/release/kanso directly
      - run: cargo build --release
      - run: sh scripts/book_check.sh

  cost-goldens:
    name: cost goldens (deterministic ratchet, no clocks)
    runs-on: ubuntu-latest
    steps:
      # the page-drift check below counts log entries since docs/compiler.html
      # last moved, which a shallow clone cannot see: one commit holds every
      # file, so the diff is always empty and the gate passes on anything
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: build the benchmarks
        run: sh scripts/gates/build_benchmarks.sh
      # Each vein reports even when a sibling is red. They measure independent
      # dimensions, so stopping at the first disagreement hides the rest: a
      # stale machine-code golden kept the instruction counts from being
      # measured at all for two runs, and the decoder was 12.2% slower the
      # whole time with nothing able to say so.
      - name: what the decoder emits
        id: emitted
        continue-on-error: true
        run: sh scripts/gates/emitted_code.sh
      - name: how much machine code
        id: text
        if: always()
        continue-on-error: true
        run: sh scripts/gates/machine_code.sh
      - name: how much work
        id: work
        if: always()
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq valgrind
          sh scripts/gates/instructions.sh
      - name: decode counters
        id: decode
        if: always()
        continue-on-error: true
        run: sh scripts/gates/decode_counters.sh
      # The only vein that can see storage the arena never held: escapebench
      # builds one accumulator per round and drops it, so its
      # perm_live_bytes is bounded by the input where every other benchmark's
      # is bounded by its text.
      - name: escape counters
        id: escape
        if: always()
        continue-on-error: true
        run: sh scripts/gates/escape_counters.sh
      - name: nothing worsens unless something improves
        if: always()
        run: |
          # NOT --depth 1: this job checks out with fetch-depth 0, and a
          # shallow fetch here TRUNCATES that history for every step after
          # it. The page-drift check below then reads zero whatever the log
          # did, which is how the page fell twenty-two entries behind while
          # this job stayed green.
          git fetch origin main
          set +e
          ./target/release/kanso run scripts/trend_gate -- origin/main >/tmp/trend.txt 2>&1
          verdict=$?
          set -e
          {
            echo "## every counter this branch moved"
            echo ""
            echo '```'
            cat /tmp/trend.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/trend.txt
          exit $verdict
      # the log is the chronology and the page is what a reader is shown; the
      # second used to follow the first by memory, and memory let ten shipped
      # optimisations land in a day without the page moving once
      - name: the page keeps up with the log
        if: always()
        run: |
          git fetch origin main || true
          ./target/release/kanso run scripts/page_drift
      - name: one-shot counters
        id: oneshot
        if: always()
        continue-on-error: true
        run: sh scripts/gates/oneshot_counters.sh
      - name: basket counters
        id: basket
        if: always()
        continue-on-error: true
        run: sh scripts/gates/basket_counters.sh
      # `if: always()` because every sibling has it and this one did not, so
      # it alone was skipped once the job had already failed — and a SKIPPED
      # vein is invisible to the summary below, which fails only on `failure`.
      # On 2026-08-27 page_drift went red over a docs budget and took this
      # gate down with it: allocations rose 537 that run and nothing said so.
      # The header of its golden calls this "the traffic the front end makes,
      # which no other gate can see", which is exactly why it must not be the
      # one that goes quiet when something else breaks.
      - name: compile allocations
        id: compile_allocs
        if: always()
        continue-on-error: true
        run: sh scripts/gates/compile_allocs.sh

      - name: compile instructions
        id: compile_ir
        if: always()
        continue-on-error: true
        run: sh scripts/gates/compile_instructions.sh
      - name: compile memory
        id: compile_memory
        if: always()
        continue-on-error: true
        run: sh scripts/gates/compile_memory.sh
      - name: encode counters
        id: encode
        if: always()
        continue-on-error: true
        run: sh scripts/gates/encode_counters.sh
      - name: wide counters
        id: wide
        if: always()
        continue-on-error: true
        run: sh scripts/gates/wide_counters.sh
      - name: pending-cell counters
        id: pend
        if: always()
        continue-on-error: true
        run: sh scripts/gates/pend_counters.sh
      # The only vein whose headline row is a PEAK rather than a total:
      # sha256 holds the whole message live at once, so arena_peak_bytes here
      # is the number a memory change moves. Every other benchmark's peak is
      # bounded by its text and says nothing.
      - name: digest counters
        id: digest
        if: always()
        continue-on-error: true
        run: sh scripts/gates/digest_counters.sh
      # The rows a failing vein wants copied into its golden are printed by
      # the gate that measured them, which is fourteen gates and two callgrind
      # dumps from the end of this job. The log API hands back a tail, so a
      # session regenerating a golden either fetches the whole log or works
      # from a number it did not measure. kq hit this first and fixed it the
      # same way. Every file here is still on disk; printing them last costs
      # nothing and puts them where the tail reaches.
      - name: the rows as measured here, to copy into the goldens
        # always, not failure: every gate above is continue-on-error, so the
        # job has not failed yet when this runs — the verdict step below is
        # what fails. Printing on a green run costs thirty lines and is the
        # difference between a session having the numbers and guessing them.
        if: always()
        run: |
          for f in work.txt emitted.txt emitted_others.txt text.txt; do
            [ -f "$f" ] || continue
            echo "=== $f"
            cat "$f"
          done
          [ -f compile_ir_got.txt ] && { echo "=== compile_ir_got.txt"; cat compile_ir_got.txt; }
          exit 0
      - name: every vein had its say
        if: always()
        run: |
          fail=0
          for vein in "emitted:${{ steps.emitted.outcome }}" \
                      "machine code:${{ steps.text.outcome }}" \
                      "work:${{ steps.work.outcome }}" \
                      "decode counters:${{ steps.decode.outcome }}" \
                      "escape counters:${{ steps.escape.outcome }}" \
                      "one-shot counters:${{ steps.oneshot.outcome }}" \
                      "basket counters:${{ steps.basket.outcome }}" \
                      "compile memory:${{ steps.compile_memory.outcome }}" \
                      "compile allocations:${{ steps.compile_allocs.outcome }}" \
                      "compile instructions:${{ steps.compile_ir.outcome }}" \
                      "encode counters:${{ steps.encode.outcome }}" \
                      "wide counters:${{ steps.wide.outcome }}" \
                      "pending-cell counters:${{ steps.pend.outcome }}" \
                      "digest counters:${{ steps.digest.outcome }}"; do
            case "$vein" in
              *:failure)
                echo "::error::${vein%:*} disagrees with its golden"
                fail=1
                ;;
            esac
          done
          exit $fail

  downstream:
    name: kq specs (a real program, gating)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # kq caught a compiler bug that nineteen suites, ninety-eight
      # differential programs, three cost veins and every memory pin agreed
      # was not there: an in-place string concat printed 267 nul bytes at
      # exactly the right length, so every count still matched. Reducing it
      # to a fixture here failed twice, which is the argument for running the
      # program rather than another reduction of it. Its goldens are byte
      # comparisons against jq over unicode, escapes and deep paths, and they
      # cost half a minute.
      - name: build the compiler
        run: cargo build --release
      # Gating on kq's CORRECTNESS and reporting its stored numbers, because
      # the two go stale differently. kq's unit tests, its twelve fixture
      # goldens against jq, and its scale gate all compute their reference
      # inside the same run: they cannot be stale and a break in any of them
      # is this compiler's fault. Its cost goldens and its published-numbers
      # stamp compare against files committed in kq, which are only true for
      # the compiler kq pins — so between a kanso merge and kq's pin bump they
      # disagree, and an unrelated PR opened in that window failed on a number
      # that had nothing to do with it. Three did.
      #
      # Those numbers are not unwatched: kq's own CI gates them, at the moment
      # kq chooses to absorb a compiler, where the compiler that produced them
      # is the compiler being judged.
      - name: kq's own spec suite against this compiler
        run: |
          sudo apt-get install -y jq >/dev/null
          sh .github/clone-sibling.sh kq /tmp/kq
          cd /tmp/kq
          set +e
          KANSO=$GITHUB_WORKSPACE/target/release/kanso KQ_STORED=report \
            sh spec.sh >/tmp/kq.txt 2>&1
          verdict=$?
          set -e
          {
            echo "## kq against this compiler"
            echo ""
            echo "Correctness gates. The cost goldens and the published-numbers"
            echo "stamp are reported — they belong to the compiler kq pins, and"
            echo "kq's own CI gates them at the pin bump."
            echo ""
            echo '```'
            cat /tmp/kq.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/kq.txt
          exit $verdict
      # kq is the only sibling anything runs, so the other two are kept in
      # step by whoever remembers to open them. A check is not a spec suite,
      # but it turns "somebody noticed" into "the build said so".
      #
      # Each sibling is cloned by .github/clone-sibling.sh, which prefers a
      # branch of this pull request's name. A language change and the sweep it
      # forces are one change across four repositories, and without that a
      # branch cannot be green until its siblings merge and its siblings
      # cannot be green until it does.
      - name: vse still compiles against this compiler
        run: |
          sh .github/clone-sibling.sh vse /tmp/vse
          ./target/release/kanso check /tmp/vse
      - name: kanso-json still passes its own tests
        run: |
          sh .github/clone-sibling.sh kanso-json /tmp/kanso-json
          ./target/release/kanso test /tmp/kanso-json

  diagnostics:
    name: diagnostics differential (both engines say the same thing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      # asks every exported std function for the wrong thing, in every
      # argument position, and requires the two engines to answer identically
      - run: ./target/release/kanso run scripts/diagnostic_differential
      # the accumulator rewrite against the same arithmetic it refuses to
      # rewrite. no counter and no golden can see that pass disappear: it
      # changes the shape a recursion runs in and not one answer
      - run: ./target/release/kanso run scripts/trmc_differential
      # rendering is written twice — `render` in the interpreter and
      # `k_render` in the C runtime — and every print goes through it
      - run: ./target/release/kanso run scripts/render_differential
      # the same std surface, asked for the awkward thing rather than the
      # wrong one: what a function ANSWERS at its edges, not what it complains
      - run: ./target/release/kanso run scripts/behaviour_differential
      # A character read by position remembers where it stopped, and a beat
      # rewinds the arena under it. Every layout pair by every hand that moves
      # that cursor: kanso#1173 was one of the sixteen this finds.
      - run: ./target/release/kanso run scripts/beat_differential
      # integer arithmetic across the two engines. Run with no random rounds:
      # every random draw lands past the native ceiling, so the rounds spend
      # ten minutes re-confirming what the 561 edge cases already say. The
      # edges are what straddle the boundary; run it with rounds by hand to
      # probe further.
      - run: ./target/release/kanso run scripts/numeric_differential -- 0
      # how effects COMBINE — sequenced, bound, nested, run beside each other.
      # the executor is written twice with no shared code, so the two halves
      # can drift anywhere the corpus does not happen to go
      - run: ./target/release/kanso run scripts/effects_differential
      # which arm answers. dispatch is what every branch in the language is
      # made of, and it is an arm search in one engine and a switch with guard
      # chains in the other
      - run: ./target/release/kanso run scripts/dispatch_differential
      # whole modules on disk: what a directory of files sharing one namespace
      # lets through and what it refuses. the seam that hid two bugs already
      # --interp: see the note at the top of the sweep (task #57)
      - run: ./target/release/kanso run scripts/module_differential
      # a diagnostic with no golden can be reworded, weakened or lost with
      # nothing going red — the corpus grew by whoever remembered
      - run: ./target/release/kanso run scripts/diagnostic_coverage

  site:
    name: site (landing sample and playground run in a browser)
    runs-on: ubuntu-latest
    # A browser that never reaches the page leaves the server waiting on a
    # report that is not coming, and the default job timeout is six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: rebuild the engine the pages load
        run: |
          rustup target add wasm32-unknown-unknown
          sh scripts/build_wasm.sh
      - run: cargo build --release
      - run: ./target/release/kanso run scripts/site_smoke
      # the mechanical half of the writing rules. the families it cannot see —
      # milked metaphors, manufactured triples, epigram endings — still want a
      # read, which is why a clean run is necessary and not sufficient.
      # the gate is a kanso program now, so this job needs the toolchain it
      # was previously only building for the browser
      - run: cargo build --release
      - run: ./target/release/kanso run scripts/prose_check

  browser:
    name: browser differential (three engines, byte-identical, headless chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          rustup target add wasm32-unknown-unknown
          bash scripts/browser_differential.sh || {
            # A nonzero exit is not automatically a divergence: the harness
            # can fall over before it has compared anything, and a red that
            # names the wrong thing teaches everyone to re-run instead of
            # read. The harness prints its own verdict; this only says which
            # kind of failure it was.
            echo "::error::the browser differential failed. If the log shows"
            echo "::error::a per-program disagreement, the engines diverged."
            echo "::error::If it shows the harness itself erroring, that is a"
            echo "::error::defect in the harness and the engines were never"
            echo "::error::compared — do not re-run past it."
            exit 1
          }

  # Appends this commit's deterministic counters to an unprotected branch on
  # every push to main. Pages serves from main/docs and main requires review,
  # so the history cannot live there — it lives on perf-history, and the
  # compiler page fetches it in the browser: both the counter panel and the
  # chart above it read the same rows from the same url.
  #
  # This job writes nothing to the page, and must not. A redraw committed back
  # to the branch under test puts a bot commit on every pull request, and a run
  # on a bot commit waits for a human to approve it, so nothing goes green
  # unattended. Drawing in the browser costs no commit, and the series extends
  # the moment a row lands rather than the next time somebody publishes.

  ratchet:
    name: the ratchet (every gate has a mutation that turns it red)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because the `touched` step below diffs this branch
      # against its merge base with main, and a shallow checkout has no merge
      # base to find. On the first run of that step the diff failed outright
      # and the job was red for a reason that had nothing to do with a
      # mutation — the selection spec passes in a full worktree and could not
      # see the runner's clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      # The ratchet runs other jobs' gates, so it needs what those jobs
      # install. It had neither valgrind nor the wasm target, and the two rows
      # whose gate runs callgrind were red here before any mutation was
      # applied — which the ratchet reads as proof. See the script's header.
      - run: sh scripts/ratchet/toolchain.sh
      - run: cargo build --release
      # Costs one compile and no builds: it reads this file against the table,
      # then applies every mutation in a throwaway worktree to check it still
      # matches the source it patches — a sed each, about seven seconds for the
      # lot. Proving a mutation actually REDDENS its gate costs a build apiece
      # and stays in the nightly workflow. Splitting the two put the half that
      # caught #1015 where a pull request has to answer it.
      - name: every ci job carries a mutation, and every mutation still applies
        run: ./target/release/kanso run scripts/ratchet
      # And PROVE the handful this branch could have made blind. Applying is
      # not proving: both rows that went blind on 2026-08-30 still applied, and
      # the nightly said so the next morning, twice, to nobody. A mutation
      # names the source files its seds patch and a branch names the files it
      # changes; the intersection is empty for most branches and was one to
      # three rows for the three merges that did the damage.
      #
      # The worst realistic case is a branch touching src/runtime.c. It selected
      # thirteen rows and ran in six minutes when this comment was first
      # written; on 2026-09-03 it selects TWENTY-THREE and took 11m51s and
      # 12m05s on two runs of one branch, and nothing was watching that grow.
      # Those runs could not execute the callgrind gates at all — see the
      # toolchain step above — so they undercount a runtime branch by two
      # callgrind passes on the baseline and two more under mutation.
      # `prove` now also reads each selected row's gate once before mutating
      # it, which is 22 gate runs on top of those 23 rows — the added cost is
      # the gate half of what the step already pays, since the baseline shares
      # one worktree and one build. The next runtime-touching branch's job log
      # is where that lands.
      #
      # `git fetch` because checkout leaves no local main branch to diff
      # against even at full depth — it lands on a detached head.
      - name: prove the rows this branch could have made blind
        run: |
          git fetch origin main
          ./target/release/kanso run scripts/ratchet -- touched origin/main

  perf-history:
    name: perf history (appended to the history branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      # NOT main-only. The row is what the numbers page charts, and building
      # it is the only thing that checks it assembles — a PR that breaks a
      # counter's key used to reach main before anything ran this.
      - name: the row assembles, with every counter it extracted
        run: ./target/release/kanso run scripts/perf_record > /tmp/record.json
      # The replay starts at the first row carrying the whole counter set, so a
      # row that loses one is a row it must skip. perf_record builds the group
      # from the objective and cannot drift from it; what this reads is the row
      # as written, in case the group is dropped where the row is assembled.
      - name: the row carries every counter the objective weighs
        run: sh scripts/gates/row_carries_the_objective.sh /tmp/record.json
      # The chart replays the current formula over the stored rows, so it needs
      # the formula's parameters as well as the rows. Publishing them beside
      # the history is what stops the weights being retyped into the page,
      # where they would survive the next gavel and draw a formula nobody
      # ruled. Unlike the history this file is replaced, not appended: it
      # describes the model as it stands, and its history is welfare_floor.json.
      - name: the model the chart replays
        run: ./target/release/kanso run scripts/welfare -- --model > /tmp/model.txt
      - name: append to the history branch
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "kanso-ci"
          git config user.email "cshentrup@gmail.com"
          if git fetch origin perf-history 2>/dev/null; then
            git checkout -B perf-history origin/perf-history
          else
            # first run: an orphan has no commit yet, so it cannot be checked
            # out again — unstage the tree it inherits and start the file here
            git checkout --orphan perf-history
            git rm -rq --cached . 2>/dev/null || true
            rm -f history.jsonl
          fi
          [ -f history.jsonl ] || : > history.jsonl
          cat /tmp/record.json >> history.jsonl
          # keep the file bounded; the chart shows a trend, not an archive
          tail -n 500 history.jsonl > history.tmp && mv history.tmp history.jsonl
          cp /tmp/model.txt model.txt
          git add -f history.jsonl model.txt
          git commit -m "perf: $(git rev-parse --short "$GITHUB_SHA")" || exit 0
          git push origin perf-history

  # Non-blocking: reports the kanso-vs-serde decode ratio to the run summary.
