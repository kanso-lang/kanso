name: ci

on:
  pull_request:
  push:
    branches: [main]

# One job per kind of check, so a red run names what broke on the PR page
# instead of hiding it inside a single "test" job.
jobs:
  format:
    name: format (rustfmt, checked not applied)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  lint:
    name: lint (clippy, all targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # --all-targets so the specs are linted too; without it the tests drift
      # while the library stays clean.
      - run: cargo clippy --all-targets -- -D warnings

  specs:
    name: specs (unit, golden, differential)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # the wasm engine test runs docs/kanso.wasm, and the committed artifact
      # is whatever the last author remembered to rebuild — building it here
      # is what makes the third engine's result about this commit's source
      - name: rebuild the engine the wasm spec runs
        run: |
          rustup target add wasm32-unknown-unknown
          sh scripts/build_wasm.sh
      - run: cargo test
      - name: the shipped library's own tests
        run: |
          cargo run -- test lib/json
          cargo run -- test lib/list
          cargo run -- test lib/path

  other-host:
    # Every other job runs on linux, and two defects in two days turned on
    # which machine built the program: an IR that macOS refused and linux ran,
    # and a modulo that answers on ARM and raises a floating-point exception on
    # x86. Each host caught what the other could not see. The differential law
    # compares engines; nothing was comparing hosts.
    #
    # This runs the suite and the arithmetic sweep on the other one. It is the
    # only job here that is not linux, and macOS minutes bill at a multiple —
    # so it is the suite and the sweep, not the whole board.
    name: the other host (macos, arm)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # the same reason the linux suite rebuilds it: the committed artifact is
      # whatever the last author remembered, and a stale one would fail this
      # job for a reason that has nothing to do with the host
      - name: rebuild the engine the wasm spec runs
        run: |
          rustup target add wasm32-unknown-unknown
          sh scripts/build_wasm.sh
      - run: cargo test
      - name: integer arithmetic, on the architecture linux is not
        run: |
          cargo build --release
          ./target/release/kanso run scripts/numeric_differential -- 0

  playground:
    name: playground examples (every engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --test playground

  decoder:
    name: json decoder end-to-end (native, 150 decodes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          cargo build --release
          ./target/release/kanso run bench/make_jsonbench
          ./target/release/kanso build bench/jsonbench --release
          out=$(./jsonbench)
          echo "$out"
          echo "$out" | grep -q "checksum 24000" \
            || { echo "::error::native json decoder produced the wrong checksum"; exit 1; }

  utf8:
    name: utf-8 validator (differential vs an independent reference)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          cargo build --release
          ./target/release/kanso run scripts/utf8_differential

  fingerprints:
    name: asset digests (every reference rewritten, site still runs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - name: the jekyll container owns _site, so take it back
        run: sudo chown -R "$USER" ./_site
      - run: cargo build --release
      - run: ./target/release/kanso run scripts/fingerprint -- ./_site
      - name: no undigested reference survives
        run: |
          if grep -rEn 'src="/(kanso-engine|play|landing-play)\.js"' ./_site --include=*.html; then
            echo "::error::an undigested script reference survived"; exit 1
          fi
          if grep -rn "fetch('kanso.wasm')" ./_site --include=*.js; then
            echo "::error::the engine still fetches the undigested module"; exit 1
          fi

  welfare:
    name: welfare (one number over runtime and compile cost, ratcheted)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      # The score and its per-term breakdown on the run page, not only in a
      # log somebody has to open and scroll. The script still gates; this is
      # the same output, rendered where it is read.
      - name: welfare, and where it came from
        run: |
          set +e
          ./target/release/kanso run scripts/welfare >/tmp/welfare.txt 2>&1
          verdict=$?
          set -e
          {
            echo "## welfare"
            echo ""
            echo '```'
            cat /tmp/welfare.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/welfare.txt
          exit $verdict
      - name: prose numbers match the golden they quote
        run: ./target/release/kanso run scripts/golden_prose

  grammar:
    name: editor grammar (types, strings and comments still painted)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the check is a kanso program, so the job compiles the toolchain it runs
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: ./target/release/kanso run scripts/grammar_check

  book:
    name: book samples (every panel executed, outputs verified)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # book_check runs target/release/kanso directly
      - run: cargo build --release
      - run: sh scripts/book_check.sh

  cost-goldens:
    name: cost goldens (deterministic ratchet, no clocks)
    runs-on: ubuntu-latest
    steps:
      # the page-drift check below counts log entries since docs/compiler.html
      # last moved, which a shallow clone cannot see: one commit holds every
      # file, so the diff is always empty and the gate passes on anything
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: build the benchmarks
        run: |
          cargo build --release
          ./target/release/kanso run bench/make_jsonbench
          ./target/release/kanso build bench/jsonbench --release
          ./target/release/kanso build bench/encodebench --release >/dev/null
          ./target/release/kanso build bench/oneshot --release >/dev/null
          ./target/release/kanso build bench/basket --release >/dev/null
      # The decode counters below say what the program ALLOCATES. This says what
      # the compiler WROTE for it, counted from the IR before the linker runs —
      # deterministic, and blind to code layout in a way no timing can be.
      #
      # It exists because 7.6% of decode speed leaked away between 2026-07-27
      # and 2026-08-07 with every allocation counter byte-identical: the
      # decoder gained 20% more calls and 23% more branches for the same work,
      # one or two per cent at a time, and nothing was watching the dimension
      # that moved. A diffuse regression can only be caught where it happens.
      - name: what the decoder emits
        run: |
          {
            grep -c '^define' jsonbench.ll | sed 's/^/defines=/'
            grep -c 'call ' jsonbench.ll | sed 's/^/calls=/'
            grep -c '^  br \|^  switch' jsonbench.ll | sed 's/^/branches=/'
            wc -l < jsonbench.ll | tr -d ' ' | sed 's/^/lines=/'
          } > emitted.txt
          grep -v '^#' bench/emitted_golden.txt > emitted_want.txt
          diff emitted_want.txt emitted.txt || {
            echo "::error::the decoder's emitted code moved. A rise is a"
            echo "::error::regression to explain and a fall is a win to bank —"
            echo "::error::say which in the PR and regenerate"
            echo "::error::bench/emitted_golden.txt. Allocation counters cannot"
            echo "::error::see this: 7.6% of decode speed leaked away with all"
            echo "::error::of them flat."
            exit 1
          }
      # The counters below say what a program ALLOCATES and the step above
      # says what the compiler WROTE. Neither sees the machine code, and that
      # is the dimension that carried a measured 17% of the 7.6% decode
      # regression: 54,708 bytes of .text to 79,192 over eleven days, with
      # every allocation counter byte-identical the whole way. Padding an old
      # build up to that size with functions it never calls costs 1.6% of
      # decode time by itself, so this is watched now.
      - name: how much machine code
        run: |
          for b in jsonbench encodebench oneshot basket; do
            printf '%s text=%s\n' "$b" "$(size --format=sysv ./$b | awk '/^\.text/{print $2}')"
          done > text.txt
          grep -v '^#' bench/text_golden.txt > text_want.txt
          diff text_want.txt text.txt || {
            echo "::error::the machine code changed size. A rise is a"
            echo "::error::regression to explain and a fall is a win to bank —"
            echo "::error::say which in the PR and regenerate"
            echo "::error::bench/text_golden.txt. Allocation counters cannot"
            echo "::error::see this, and neither can the emitted-line count:"
            echo "::error::a fifth of those lines were dropped by the linker"
            echo "::error::anyway. 17% of the last regression lived here."
            exit 1
          }
      - name: decode counters
        run: |
          KANSO_COUNTERS=1 ./jsonbench 2>counters.txt >/dev/null
          diff bench/cost_golden.txt counters.txt || {
            echo "::error::cost counters diverged from bench/cost_golden.txt — a"
            echo "::error::performance-relevant change (allocs, arena blocks, beat"
            echo "::error::iterations). If intentional, update the golden in this PR."
            exit 1
          }
      - name: nothing worsens unless something improves
        run: |
          git fetch origin main --depth 1
          set +e
          ./target/release/kanso run scripts/trend_gate -- origin/main >/tmp/trend.txt 2>&1
          verdict=$?
          set -e
          {
            echo "## every counter this branch moved"
            echo ""
            echo '```'
            cat /tmp/trend.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/trend.txt
          exit $verdict
      # the log is the chronology and the page is what a reader is shown; the
      # second used to follow the first by memory, and memory let ten shipped
      # optimisations land in a day without the page moving once
      - name: the page keeps up with the log
        run: |
          git fetch origin main --depth 1 || true
          ./target/release/kanso run scripts/page_drift
      - name: one-shot counters
        run: |
          KANSO_COUNTERS=1 ./oneshot 2>counters_oneshot.txt >/dev/null
          diff bench/cost_golden_oneshot.txt counters_oneshot.txt || {
            echo "::error::one-shot counters diverged — the peak-footprint"
            echo "::error::term's input moved. If intentional, update the"
            echo "::error::golden in this PR."
            exit 1
          }
      - name: basket counters
        run: |
          KANSO_COUNTERS=1 ./basket 2>counters_basket.txt >/dev/null
          diff bench/cost_golden_basket.txt counters_basket.txt || {
            echo "::error::basket counters diverged — the welfare index reads"
            echo "::error::this vein, and it samples a spread of what the"
            echo "::error::language does rather than one shelf of it. If"
            echo "::error::intentional, update the golden in this PR."
            exit 1
          }

      - name: compile memory
        run: |
          KANSO_COUNTERS=1 ./target/release/kanso check lib/json 2>counters_compile.txt >/dev/null
          for k in rounds visits; do
            got=$(grep "^compile_${k}=" counters_compile.txt | cut -d= -f2)
            want=$(grep "^front_end_${k}=" bench/compile_memory_golden.txt | cut -d= -f2)
            if [ "$got" != "$want" ]; then
              echo "::error::the front end's ${k} on lib/json moved: ${want} -> ${got}."
              echo "::error::that is a welfare term. if intentional, regenerate"
              echo "::error::bench/compile_memory_golden.txt and say which way it"
              echo "::error::went in design/compiler-log.md."
              exit 1
            fi
          done
          got=$(grep '^compile_peak_bytes=' counters_compile.txt | cut -d= -f2)
          want=$(grep '^compile_peak_bytes=' bench/compile_memory_golden.txt | cut -d= -f2)
          margin=$((want / 50))
          low=$((want - margin))
          high=$((want + margin))
          echo "front end holds ${got} bytes; golden ${want}, band ${low}..${high}"
          if [ "$got" -lt "$low" ] || [ "$got" -gt "$high" ]; then
            echo "::error::what the front end holds while checking lib/json moved"
            echo "::error::more than two per cent: ${want} -> ${got}. that is a"
            echo "::error::welfare term. if intentional, regenerate"
            echo "::error::bench/compile_memory_golden.txt in this PR and say which"
            echo "::error::way it went in design/compiler-log.md."
            exit 1
          fi
      - name: encode counters
        run: |
          KANSO_COUNTERS=1 ./encodebench 2>counters_encode.txt >/dev/null
          diff bench/cost_golden_encode.txt counters_encode.txt || {
            echo "::error::encode counters diverged from cost_golden_encode.txt."
            echo "::error::A kernel's presence counter moved — a fast path was"
            echo "::error::dropped, rerouted, or intentionally changed. If"
            echo "::error::intentional, update the golden in this PR."
            exit 1
          }

  downstream:
    name: kq specs (a real program, gating)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # kq caught a compiler bug that nineteen suites, ninety-eight
      # differential programs, three cost veins and every memory pin agreed
      # was not there: an in-place string concat printed 267 nul bytes at
      # exactly the right length, so every count still matched. Reducing it
      # to a fixture here failed twice, which is the argument for running the
      # program rather than another reduction of it. Its goldens are byte
      # comparisons against jq over unicode, escapes and deep paths, and they
      # cost half a minute.
      - name: build the compiler
        run: cargo build --release
      # Gating on kq's CORRECTNESS and reporting its stored numbers, because
      # the two go stale differently. kq's unit tests, its twelve fixture
      # goldens against jq, and its scale gate all compute their reference
      # inside the same run: they cannot be stale and a break in any of them
      # is this compiler's fault. Its cost goldens and its published-numbers
      # stamp compare against files committed in kq, which are only true for
      # the compiler kq pins — so between a kanso merge and kq's pin bump they
      # disagree, and an unrelated PR opened in that window failed on a number
      # that had nothing to do with it. Three did.
      #
      # Those numbers are not unwatched: kq's own CI gates them, at the moment
      # kq chooses to absorb a compiler, where the compiler that produced them
      # is the compiler being judged.
      - name: kq's own spec suite against this compiler
        run: |
          sudo apt-get install -y jq >/dev/null
          sh .github/clone-sibling.sh kq /tmp/kq
          cd /tmp/kq
          set +e
          KANSO=$GITHUB_WORKSPACE/target/release/kanso KQ_STORED=report \
            sh spec.sh >/tmp/kq.txt 2>&1
          verdict=$?
          set -e
          {
            echo "## kq against this compiler"
            echo ""
            echo "Correctness gates. The cost goldens and the published-numbers"
            echo "stamp are reported — they belong to the compiler kq pins, and"
            echo "kq's own CI gates them at the pin bump."
            echo ""
            echo '```'
            cat /tmp/kq.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/kq.txt
          exit $verdict
      # kq is the only sibling anything runs, so the other two are kept in
      # step by whoever remembers to open them. A check is not a spec suite,
      # but it turns "somebody noticed" into "the build said so".
      #
      # Each sibling is cloned by .github/clone-sibling.sh, which prefers a
      # branch of this pull request's name. A language change and the sweep it
      # forces are one change across four repositories, and without that a
      # branch cannot be green until its siblings merge and its siblings
      # cannot be green until it does.
      - name: vse still compiles against this compiler
        run: |
          sh .github/clone-sibling.sh vse /tmp/vse
          ./target/release/kanso check /tmp/vse
      - name: kanso-json still passes its own tests
        run: |
          sh .github/clone-sibling.sh kanso-json /tmp/kanso-json
          ./target/release/kanso test /tmp/kanso-json

  diagnostics:
    name: diagnostics differential (both engines say the same thing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      # asks every exported std function for the wrong thing, in every
      # argument position, and requires the two engines to answer identically
      - run: ./target/release/kanso run scripts/diagnostic_differential
      # rendering is written twice — `render` in the interpreter and
      # `k_render` in the C runtime — and every print goes through it
      - run: ./target/release/kanso run scripts/render_differential
      # the same std surface, asked for the awkward thing rather than the
      # wrong one: what a function ANSWERS at its edges, not what it complains
      - run: ./target/release/kanso run scripts/behaviour_differential
      # integer arithmetic across the two engines. Run with no random rounds:
      # every random draw lands past the native ceiling, so the rounds spend
      # ten minutes re-confirming what the 561 edge cases already say. The
      # edges are what straddle the boundary; run it with rounds by hand to
      # probe further.
      - run: ./target/release/kanso run scripts/numeric_differential -- 0
      # how effects COMBINE — sequenced, bound, nested, run beside each other.
      # the executor is written twice with no shared code, so the two halves
      # can drift anywhere the corpus does not happen to go
      - run: ./target/release/kanso run scripts/effects_differential
      # which arm answers. dispatch is what every branch in the language is
      # made of, and it is an arm search in one engine and a switch with guard
      # chains in the other
      - run: ./target/release/kanso run scripts/dispatch_differential
      # whole modules on disk: what a directory of files sharing one namespace
      # lets through and what it refuses. the seam that hid two bugs already
      # --interp: see the note at the top of the sweep (task #57)
      - run: ./target/release/kanso run scripts/module_differential
      # a diagnostic with no golden can be reworded, weakened or lost with
      # nothing going red — the corpus grew by whoever remembered
      - run: ./target/release/kanso run scripts/diagnostic_coverage

  site:
    name: site (landing sample and playground run in a browser)
    runs-on: ubuntu-latest
    # A browser that never reaches the page leaves the server waiting on a
    # report that is not coming, and the default job timeout is six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: rebuild the engine the pages load
        run: |
          rustup target add wasm32-unknown-unknown
          sh scripts/build_wasm.sh
      - run: cargo build --release
      - run: ./target/release/kanso run scripts/site_smoke
      # the mechanical half of the writing rules. the families it cannot see —
      # milked metaphors, manufactured triples, epigram endings — still want a
      # read, which is why a clean run is necessary and not sufficient.
      # the gate is a kanso program now, so this job needs the toolchain it
      # was previously only building for the browser
      - run: cargo build --release
      - run: ./target/release/kanso run scripts/prose_check

  browser:
    name: browser differential (three engines, byte-identical, headless chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          rustup target add wasm32-unknown-unknown
          bash scripts/browser_differential.sh || {
            # A nonzero exit is not automatically a divergence: the harness
            # can fall over before it has compared anything, and a red that
            # names the wrong thing teaches everyone to re-run instead of
            # read. The harness prints its own verdict; this only says which
            # kind of failure it was.
            echo "::error::the browser differential failed. If the log shows"
            echo "::error::a per-program disagreement, the engines diverged."
            echo "::error::If it shows the harness itself erroring, that is a"
            echo "::error::defect in the harness and the engines were never"
            echo "::error::compared — do not re-run past it."
            exit 1
          }

  # Appends this commit's deterministic counters to an unprotected branch on
  # every push to main. Pages serves from main/docs and main requires review,
  # so the history cannot live there — it lives on perf-history, and the
  # compiler page fetches it in the browser: both the counter panel and the
  # chart above it read the same rows from the same url.
  #
  # This job writes nothing to the page, and must not. A redraw committed back
  # to the branch under test puts a bot commit on every pull request, and a run
  # on a bot commit waits for a human to approve it, so nothing goes green
  # unattended. Drawing in the browser costs no commit, and the series extends
  # the moment a row lands rather than the next time somebody publishes.
  perf-history:
    name: perf history (appended to the history branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: record this commit
        if: github.ref == 'refs/heads/main'
        run: ./target/release/kanso run scripts/perf_record > /tmp/record.json
      - name: append to the history branch
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "kanso-ci"
          git config user.email "cshentrup@gmail.com"
          if git fetch origin perf-history 2>/dev/null; then
            git checkout -B perf-history origin/perf-history
          else
            # first run: an orphan has no commit yet, so it cannot be checked
            # out again — unstage the tree it inherits and start the file here
            git checkout --orphan perf-history
            git rm -rq --cached . 2>/dev/null || true
            rm -f history.jsonl
          fi
          [ -f history.jsonl ] || : > history.jsonl
          cat /tmp/record.json >> history.jsonl
          # keep the file bounded; the chart shows a trend, not an archive
          tail -n 500 history.jsonl > history.tmp && mv history.tmp history.jsonl
          git add -f history.jsonl
          git commit -m "perf: $(git rev-parse --short "$GITHUB_SHA")" || exit 0
          git push origin perf-history

  # Non-blocking: reports the kanso-vs-serde decode ratio to the run summary.
