name: ci

on:
  pull_request:
  push:
    branches: [main]

# One job per kind of check, so a red run names what broke on the PR page
# instead of hiding it inside a single "test" job.
jobs:
  lint:
    name: lint (clippy, all targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # --all-targets so the specs are linted too; without it the tests drift
      # while the library stays clean.
      - run: cargo clippy --all-targets -- -D warnings

  specs:
    name: specs (unit, golden, differential)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - name: the shipped library's own tests
        run: cargo run -- test lib/json

  playground:
    name: playground examples (every engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --test playground

  decoder:
    name: json decoder end-to-end (native, 150 decodes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          cargo build --release
          bash bench/make_jsonbench.sh
          ./target/release/kanso build bench/jsonbench --release
          out=$(./jsonbench)
          echo "$out"
          echo "$out" | grep -q "checksum 24000" \
            || { echo "::error::native json decoder produced the wrong checksum"; exit 1; }

  book:
    name: book samples (every panel executed, outputs verified)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # book_check runs target/release/kanso directly
      - run: cargo build --release
      - run: sh scripts/book_check.sh

  cost-goldens:
    name: cost goldens (deterministic ratchet, no clocks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build the benchmarks
        run: |
          cargo build --release
          bash bench/make_jsonbench.sh
          ./target/release/kanso build bench/jsonbench --release
          ./target/release/kanso build bench/encodebench --release >/dev/null
      - name: decode counters
        run: |
          KANSO_COUNTERS=1 ./jsonbench 2>counters.txt >/dev/null
          diff bench/cost_golden.txt counters.txt || {
            echo "::error::cost counters diverged from bench/cost_golden.txt — a"
            echo "::error::performance-relevant change (allocs, arena blocks, beat"
            echo "::error::iterations). If intentional, update the golden in this PR."
            exit 1
          }
      - name: encode counters
        run: |
          KANSO_COUNTERS=1 ./encodebench 2>counters_encode.txt >/dev/null
          diff bench/cost_golden_encode.txt counters_encode.txt || {
            echo "::error::encode counters diverged from cost_golden_encode.txt."
            echo "::error::A kernel's presence counter moved — a fast path was"
            echo "::error::dropped, rerouted, or intentionally changed. If"
            echo "::error::intentional, update the golden in this PR."
            exit 1
          }

  site:
    name: site (landing sample and playground run in a browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: rebuild the engine the pages load
        run: |
          rustup target add wasm32-unknown-unknown
          sh scripts/build_wasm.sh
      - run: python3 scripts/site_smoke.py

  browser:
    name: browser differential (three engines, byte-identical, headless chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          rustup target add wasm32-unknown-unknown
          bash scripts/browser_differential.sh || {
            echo "::error::the browser wasm engine diverged from the oracle."
            exit 1
          }

  # Publishes the deterministic counters to an unprotected branch on every
  # push to main; the compiler page charts them. Pages serves from main/docs
  # and main requires review, so history cannot live there — it lives on
  # perf-history and the panel fetches it.
  perf-history:
    name: perf history (published to the compiler page)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: record this commit
        run: python3 scripts/perf_record.py > /tmp/record.json
      - name: append to the history branch
        run: |
          git config user.name "kanso-ci"
          git config user.email "ci@kanso-lang.dev"
          if git fetch origin perf-history 2>/dev/null; then
            git checkout -B perf-history origin/perf-history
          else
            # first run: an orphan has no commit yet, so it cannot be checked
            # out again — unstage the tree it inherits and start the file here
            git checkout --orphan perf-history
            git rm -rq --cached . 2>/dev/null || true
            rm -f history.jsonl
          fi
          [ -f history.jsonl ] || : > history.jsonl
          cat /tmp/record.json >> history.jsonl
          # keep the file bounded; the chart shows a trend, not an archive
          tail -n 500 history.jsonl > history.tmp && mv history.tmp history.jsonl
          git add -f history.jsonl
          git commit -m "perf: $(python3 -c "import json;print(json.load(open('/tmp/record.json'))['commit'])")" || exit 0
          git push origin perf-history

  # Non-blocking: reports the kanso-vs-serde decode ratio to the run summary.
  # CI runners are noisy, so this tracks the number for visibility rather than
  # gating on it; the gating perf specs are the cost goldens above.
  benchmark:
    name: benchmark (reported, not gated)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build engines
        run: |
          cargo build --release
          bash bench/make_jsonbench.sh
          ./target/release/kanso build bench/jsonbench --release
          (cd bench/serde_bench && cargo build --release)
      - name: race (best of 3)
        run: |
          best() {
            b=99999
            for i in 1 2 3; do
              t=$( { /usr/bin/time -f '%e' "$@" >/dev/null; } 2>&1 )
              awk -v a="$t" -v b="$b" 'BEGIN{exit !(a<b)}' && b=$t
            done
            echo "$b"
          }
          kanso_wall=$(best ./jsonbench)
          kanso_ms=$(awk -v w="$kanso_wall" 'BEGIN{printf "%.2f", w/150*1000}')
          serde_line=$(./bench/serde_bench/target/release/serde_bench bench/large.json | tail -1)
          {
            echo "## json decode benchmark (188 KB, 150 decodes)"
            echo ""
            echo "| engine | per decode |"
            echo "| --- | --- |"
            echo "| kanso (native) | ${kanso_ms} ms |"
            echo "| serde_json | ${serde_line#serde mean over 150 decodes: } |"
            echo ""
            echo "Runners are noisy, so this table informs rather than gates. Under slope timing on a quiet-enough box the two are a dead heat; the gating perf specs are the cost goldens."
          } >> "$GITHUB_STEP_SUMMARY"
